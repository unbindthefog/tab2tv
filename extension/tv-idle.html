<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>TabToTV</title>
<style>
  /* Placeholder tab of the TV window: shown while no video is on the TV, keeps the fullscreen
     window open so the next video appears without macOS's fullscreen animation. */
  html, body { height: 100%; margin: 0; background: #000; cursor: none; }
  body { display: flex; align-items: center; justify-content: center; }
  h1 { font: 700 28px ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .2em; color: #3a3a3c; margin: 0; }
</style>
</head>
<body><h1>TABTOTV</h1></body>
</html>
