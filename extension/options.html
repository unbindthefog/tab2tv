<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>tab2tv</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Palette and the settings blocks (fieldset, hint, advanced): style.css, shared with the popup. */
  body { font: 14px/1.5 system-ui, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; color: var(--strong); background: var(--bg); }
  input[type=number] { width: 80px; }
  textarea { width: 100%; height: 70px; box-sizing: border-box; }
  textarea:disabled { opacity: .5; }
  #saved { color: var(--on); margin-left: 8px; }
  select { max-width: 100%; }
</style>
</head>
<body class="settings">
<h1>tab2tv</h1>
<fieldset>
  <legend data-i18n="optTarget"></legend>
  <label>
    <select id="targetDisplay"></select>
  </label>
  <div id="displayStatus" class="hint"></div>
</fieldset>
<fieldset>
  <legend data-i18n="optAuto"></legend>
  <label><span data-i18n="optAutoSites"></span>
    <textarea id="autoSites"></textarea></label>
  <label><input type="checkbox" id="autoAllSites"> <span data-i18n="optAutoAll"></span></label>
</fieldset>
<fieldset>
  <legend data-i18n="optLook"></legend>
  <label><input type="checkbox" id="parallel"> <span data-i18n="optParallel"></span></label>
  <label><span data-i18n="optOnEnded"></span>
    <select id="onEnded">
      <option value="stay" data-i18n="optEndedStay"></option>
      <option value="return" data-i18n="optEndedReturn"></option>
      <option value="black" data-i18n="optEndedBlack"></option>
    </select>
  </label>
  <div class="hint"><span data-i18n="optCornersHint"></span>
    <a href="#" id="braveCorners" data-i18n="optCornersLink"></a>.</div>
</fieldset>
<details class="advanced">
  <summary data-i18n="optAdvanced"></summary>
  <h3 data-i18n="optThresholds"></h3>
  <label><span data-i18n="optMinDuration"></span> <input type="number" id="minDurationSec" min="0"> <span data-i18n="optSeconds"></span></label>
  <label><span data-i18n="optMinWidth"></span> <input type="number" id="minWidthPx" min="0"> px</label>
  <h3 data-i18n="optTabs"></h3>
  <label><span data-i18n="optBackgroundClose"></span>
    <input type="number" id="backgroundCloseSec" min="5"> <span data-i18n="optSeconds"></span></label>
  <h3 data-i18n="optDisplays"></h3>
  <button id="showNames" type="button" data-i18n="optShowNames"></button>
  <div class="hint" data-i18n="optShowNamesHint"></div>
  <details>
    <summary data-i18n="optDiagnosis"></summary>
    <pre id="displayLog"></pre>
  </details>
</details>
<button id="save" data-i18n="optSave"></button><span id="saved"></span>
<script src="settings.js"></script>
<script src="options.js"></script>
</body>
</html>
