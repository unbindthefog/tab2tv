<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>tab2tv – Einstellungen</title>
<style>
  /* Light/dark follows the system; same palette as the toolbar popup. */
  :root { color-scheme: light dark;
    --bg: #f4f4f5; --text: #2a2a2e; --muted: #6b6b70; --border: #c9c9ce; --panel: #ffffff; --code: #ececef; --ok: #157a2c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #18181a; --text: #e6e6e6; --muted: #8a8a8a; --border: #333338; --panel: #232326; --code: #1f1f22; --ok: #3ccf55; }
  }
  body { font: 14px/1.5 system-ui, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; color: var(--text); background: var(--bg); }
  fieldset { border: 1px solid var(--border); border-radius: 8px; margin: 0 0 16px; padding: 12px 16px; background: var(--panel); }
  label { display: block; margin: 6px 0; }
  input[type=number] { width: 80px; }
  textarea { width: 100%; height: 70px; box-sizing: border-box; }
  textarea:disabled { opacity: .5; }
  #saved { color: var(--ok); margin-left: 8px; }
  select { max-width: 100%; }
  .hint { color: var(--muted); font-size: 13px; margin: 6px 0; }
  pre { font-size: 12px; background: var(--code); padding: 8px; overflow-x: auto; }
  details.advanced { border: 1px solid var(--border); border-radius: 8px; margin: 0 0 16px; padding: 8px 16px; background: var(--panel); }
  details.advanced > summary { cursor: pointer; font-weight: 600; }
  details.advanced h3 { font-size: 14px; margin: 14px 0 4px; }
</style>
</head>
<body>
<h1>tab2tv</h1>
<fieldset>
  <legend>Zielbildschirm</legend>
  <label>
    <select id="targetDisplay"></select>
  </label>
  <div id="displayStatus" class="hint"></div>
</fieldset>
<fieldset>
  <legend>Automatik</legend>
  <label>Videos auf diesen Websites beim Start automatisch auf den TV ausgeben (eine pro Zeile, gilt auch für Subdomains):
    <textarea id="autoSites"></textarea></label>
  <label><input type="checkbox" id="autoAllSites"> Auf allen Websites automatisch ausgeben</label>
</fieldset>
<fieldset>
  <legend>Darstellung</legend>
  <label><input type="checkbox" id="parallel"> Paralleldarstellung: Video läuft im Player der Seite weiter</label>
  <label>Bei Videoende:
    <select id="onEnded">
      <option value="stay">auf dem TV stehen lassen</option>
      <option value="return">zurückholen</option>
      <option value="black">TV schwarz</option>
    </select>
  </label>
</fieldset>
<details class="advanced">
  <summary>Erweitert</summary>
  <h3>Automatik: Schwellwerte</h3>
  <label>Mindestdauer <input type="number" id="minDurationSec" min="0"> Sekunden</label>
  <label>Mindestbreite im Player <input type="number" id="minWidthPx" min="0"> px</label>
  <h3>Mehrere Tabs</h3>
  <label>Ein TV-Fenster im Hintergrund (anderer Tab hat den TV übernommen) schließen nach
    <input type="number" id="backgroundCloseSec" min="5"> Sekunden</label>
  <h3>Bildschirme</h3>
  <button id="showNames" type="button">Bildschirmnamen anzeigen</button>
  <div class="hint">Fragt einmalig die Berechtigung zur Fensterverwaltung an, damit Namen wie „Wohnzimmer“ statt „Externer Bildschirm“ erscheinen.</div>
  <details>
    <summary>Diagnose: letzte Bildschirm-Änderungen</summary>
    <pre id="displayLog"></pre>
  </details>
</details>
<button id="save">Speichern</button><span id="saved"></span>
<script src="settings.js"></script>
<script src="options.js"></script>
</body>
</html>
