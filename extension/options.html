<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>TabToTV – Einstellungen</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; color: #222; }
  fieldset { border: 1px solid #ddd; border-radius: 8px; margin: 0 0 16px; padding: 12px 16px; }
  label { display: block; margin: 6px 0; }
  input[type=number] { width: 80px; }
  textarea { width: 100%; height: 70px; }
  #saved { color: #2e7d32; margin-left: 8px; }
</style>
</head>
<body>
<h1>TabToTV</h1>
<fieldset>
  <legend>Automatik</legend>
  <label><input type="checkbox" id="autoEnabled"> Videos beim Start automatisch auf den TV ausgeben</label>
  <label>Mindestdauer <input type="number" id="minDurationSec" min="0"> Sekunden</label>
  <label>Mindestbreite im Player <input type="number" id="minWidthPx" min="0"> px</label>
  <label>Automatik aus auf diesen Websites (ein Hostname pro Zeile):<textarea id="disabledSites"></textarea></label>
</fieldset>
<fieldset>
  <legend>Darstellung</legend>
  <label><input type="checkbox" id="parallel"> Paralleldarstellung: Video läuft zusätzlich im Player der Seite weiter</label>
  <label>Bei Videoende:
    <select id="onEnded">
      <option value="stay">auf dem TV stehen lassen</option>
      <option value="return">zurückholen</option>
      <option value="black">TV schwarz</option>
    </select>
  </label>
</fieldset>
<p>Tastenkombination ändern: <code>brave://extensions/shortcuts</code></p>
<button id="save">Speichern</button><span id="saved"></span>
<script src="settings.js"></script>
<script src="options.js"></script>
</body>
</html>
