<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>TabToTV</title>
<style>
  /* Minimal panel: flat dark keys, mono all-caps legends, one colored status line per key. */
  :root { color-scheme: dark; --mono: ui-monospace, "SF Mono", Menlo, monospace; }
  body { font: 11px/1.4 var(--mono); width: 230px; margin: 0; padding: 10px;
    color: #8a8a8a; background: #18181a; }
  .panel { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .key { font: 600 13px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase;
    height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    color: #e6e6e6; background: #232326; border: 1px solid #333338; border-radius: 4px; cursor: pointer; }
  .key:hover:not(:disabled) { background: #2b2b2f; }
  .key:active:not(:disabled) { background: #1f1f22; }
  .key:disabled { cursor: default; color: #6a6a70; }
  .lamp { font-size: 11px; min-height: 14px; letter-spacing: .1em; }
  .lamp.on { color: #3ccf55; }
  .lamp.off { color: #ff5a5a; }
  .lamp.info { color: #e2c048; }
  .hint { margin: 10px 2px 4px; }
  .status { margin: 2px; color: #c8c8c8; }
  .status.warn { color: #ff5a5a; }
  h1 { font: 600 10px var(--mono); letter-spacing: .2em; color: #505055; margin: 10px 2px 0; }
</style>
</head>
<body>
<!-- Frequently used keys on top: shortest mouse path from the toolbar icon. -->
<div class="panel">
  <button class="key" id="tabToggle" type="button" title="Video dieses Tabs auf den TV / zurückholen">SEND<span class="lamp" id="sendLamp"></span></button>
  <button class="key" id="auto" type="button" title="Automatik an/aus">AUTO<span class="lamp" id="autoLamp"></span></button>
  <button class="key" id="closeAll" type="button" title="Alle TV-Fenster schließen">CLEAR<span class="lamp" id="clearLamp"></span></button>
  <button class="key" id="options" type="button" title="Einstellungen">OPT<span class="lamp"></span></button>
</div>
<p id="autoHint" class="hint"></p>
<p id="display" class="status"></p>
<p id="tabState" class="status"></p>
<h1>TABTOTV</h1>
<script src="settings.js"></script>
<script src="popup.js"></script>
</body>
</html>
