<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>tab2tv</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Palette, keys, lamps and footer: style.css. */
  body { font: 9px/1.4 var(--mono); width: 173px; margin: 0; padding: 8px; color: var(--text); background: var(--bg); }
  /* Status line above the keys (as in tab2ping): a dot for what SEND can do here, then the video
     title (or the page's host if there is no video). Green: a video that can be sent; yellow: one
     that can't be copied and goes to the TV in a picture-in-picture window (DRM, no CORS); grey: none,
     or one that can't be sent. */
  .status { display: flex; align-items: center; gap: 6px; margin: 0 2px 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--disabled); flex: none; }
  .dot.copy { background: var(--on); } .dot.move { background: var(--info); }
  #title { font-weight: 600; color: var(--strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  #title.none { font-weight: 400; color: var(--text); }
</style>
</head>
<body>
<div class="status"><span class="dot" id="dot"></span><span id="title"></span></div>
<!-- Frequently used keys on the right: the popup opens below the toolbar icon, aligned to its right
     edge, so SEND sits right under the mouse after the click on the icon. No autofocus: Chromium
     then draws the keyboard focus ring on SEND even after a mouse click; without it, no key has
     focus on opening, so Enter does nothing. -->
<div class="panel">
  <button class="key" id="closeAll" type="button" data-i18n-title="keyClearTip">CLEAR<span class="lamp" id="clearLamp"></span></button>
  <button class="key" id="tabToggle" type="button" data-i18n-title="keySendTip">SEND<span class="lamp" id="sendLamp"></span></button>
  <button class="key" id="options" type="button" data-i18n-title="keyOptTip">OPT<span class="lamp"></span></button>
  <button class="key" id="auto" type="button" data-i18n-title="keyAutoTip">AUTO<span class="lamp" id="autoLamp"></span></button>
</div>
<footer class="footer"><h1>tab2tv</h1><span class="version" id="version"></span></footer>
<!-- Branch and hash, written by .git/hooks/post-commit (gitignored, may be missing). -->
<script src="version.js"></script>
<script src="settings.js"></script>
<script src="popup.js"></script>
</body>
</html>
